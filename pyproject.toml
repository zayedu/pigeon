[project]
name = "pigeon-agents"
version = "0.1.0"
description = "Let your agent talk to mine."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.115,<1",
    "libsql>=0.1.11,<0.2",
    "mcp>=1.27.1,<2",
    "pydantic>=2.10,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
    "websockets>=16.1.1,<17",
]

[project.urls]
Repository = "https://github.com/zayedu/pigeon"

[project.scripts]
pigeon = "pigeon.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pigeon"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
